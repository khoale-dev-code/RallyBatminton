# Build bộ cài Rally Manager cho Windows (Tauri) trên máy Windows của GitHub.
#   - Bấm Actions → "Rally Manager (Windows)" → Run workflow → tải bộ cài ở mục Artifacts.
#   - Hoặc đẩy tag manager-v1.0.0 → tạo GitHub Release kèm bộ cài.
# Máy chủ mà ứng dụng mở: biến repository RALLY_URL (Settings → Secrets and variables → Actions → Variables),
# để trống = https://rally-eight-tau.vercel.app. Không cần khóa bí mật nào.
name: Rally Manager (Windows)

on:
  workflow_dispatch:
  push:
    tags: ['manager-v*']

permissions:
  contents: read

concurrency:
  group: rally-manager-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      contents: write
    env:
      RALLY_URL: ${{ vars.RALLY_URL }}
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Công cụ Tauri
        run: npm ci --no-audit --no-fund

      - name: Kiểm thử
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Build bộ cài
        run: npx tauri build --bundles nsis

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rally-manager-windows
          path: desktop/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 30

      - name: Phát hành (tag manager-v*)
        if: startsWith(github.ref, 'refs/tags/manager-v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" src-tauri/target/release/bundle/nsis/*.exe --title "Rally Manager $TAG" --notes "Bộ cài Rally Manager cho Windows 10/11."
